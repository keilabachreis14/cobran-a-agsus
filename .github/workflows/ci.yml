name: Testes do Robo de Cobrancas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, testes-e-correcao-mvp-combo-ubs]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install -r mvp/requirements.txt

      - name: Verificar sintaxe
        run: |
          python -m py_compile app.py app_original_review.py
          python -m py_compile mvp/app.py mvp/modules/messages.py

      - name: Verificar Flask
        run: python -c "import flask; print('Flask instalado corretamente')"

      - name: Testes do MVP COMBO UBS
        working-directory: mvp
        run: python -m unittest discover -s tests -v
